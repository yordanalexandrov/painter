<!doctype html>
<!-- PROTOTYPE — throwaway viewer generated by prototype/variants.py -->
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painter prototype — __TITLE__</title>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: grid;
         grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh;
         background: #e9e7e2; color: #222; }
  #imgbar { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; padding: 6px 10px;
            background: #111; color: #ccc; font-size: 13px; overflow-x: auto; }
  #imgbar a { color: #ddd; text-decoration: none; padding: 4px 10px; border-radius: 999px;
              background: #2a2a2a; white-space: nowrap; }
  #imgbar a.on { background: #f0c040; color: #111; font-weight: 600; }
  #imgbar a.v1 { opacity: .55; }
  #stage { position: relative; overflow: hidden; }
  #canvas { position: relative; transform-origin: 0 0; }
  #canvas > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #orig, #imp { pointer-events: none; }
  aside { background: #fff; overflow: auto; padding: 14px; border-left: 1px solid #ccc; }
  h2 { font-size: 15px; margin: 4px 0 8px; }
  .modes button, .tools button { margin: 0 4px 4px 0; padding: 5px 9px; border: 1px solid #bbb;
         background: #f6f6f6; border-radius: 6px; cursor: pointer; }
  .modes button.on { background: #222; color: #fff; border-color: #222; }
  table.stats { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 13px; }
  table.stats td { padding: 2px 0; border-bottom: 1px solid #eee; }
  table.stats td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .pal { list-style: none; padding: 0; margin: 0; }
  .pal li { display: grid; grid-template-columns: 26px 34px 1fr auto; gap: 6px; align-items: center;
            padding: 4px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .pal li:hover { background: #f2f2f2; }
  .pal li.on { background: #222; color: #fff; }
  .pal b { text-align: right; }
  .sw { width: 34px; height: 22px; border-radius: 4px; border: 1px solid #0003; }
  .share { color: #888; font-size: 12px; }
  .tubes { font-size: 12px; color: #555; }

  /* modes */
  svg text { fill: #333; text-anchor: middle; dominant-baseline: central; font-family: system-ui, sans-serif;
             pointer-events: none; }
  .m-outline .r { fill: #fff; stroke: #666; stroke-width: .35; }
  .m-color .r { stroke-width: .6; }
  .m-color .labels, .m-orig .labels, .m-imp .labels { display: none; }
  .m-color.nums .labels { display: inline; }
  .m-color.nums svg text { fill: #000a; }
  .m-orig svg { opacity: 0; }
  .hl .r:not(.on) { opacity: .18; }
  .m-outline.hl .r:not(.on) { opacity: 1; }
  .hl text:not(.on) { opacity: .25; }

  #tip { position: fixed; pointer-events: none; background: #222; color: #fff; padding: 4px 8px;
         border-radius: 5px; font-size: 12px; display: none; z-index: 10; }
  #switcher { position: fixed; bottom: 16px; left: calc((100vw - 340px) / 2); transform: translateX(-50%);
              background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex;
              gap: 8px; align-items: center; box-shadow: 0 4px 16px #0005; z-index: 20; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px;
                     cursor: pointer; font-size: 16px; }
  #switcher span { min-width: 260px; text-align: center; }
  .note { font-size: 12px; color: #777; margin-top: 14px; }
</style>
</head>
<body>
<nav id="imgbar">Изображение:</nav>
<div id="stage"><div id="canvas"><img id="orig" src="__ORIGINAL__" alt=""><img id="imp" src="__IMPORTANCE__" alt="" style="display:none"><div id="svgHost"></div></div></div>
<aside>
  <h2 id="vname"></h2>
  <div class="modes">
    <button data-m="outline">Контури</button>
    <button data-m="color">Оцветено</button>
    <button data-m="orig">Оригинал</button>
    <button data-m="imp">Важност</button>
  </div>
  <div class="tools">
    <label><input type="checkbox" id="nums"> номера при „Оцветено“</label><br>
    <label>Оригинал отдолу: <input type="range" id="op" min="0" max="100" value="0"></label><br>
    <button id="reset">Нулирай изгледа</button>
  </div>
  <table class="stats" id="stats"></table>
  <h2>Палитра <span class="share">(клик = покажи полетата)</span></h2>
  <ul class="pal" id="pal"></ul>
  <h2 style="margin-top:14px">Нужни туби</h2>
  <div class="tubes" id="tubes"></div>
  <p class="note">Прототип. Цветовете на тубите и смесите са приблизителни (груб модел на смесване).</p>
</aside>
<div id="tip"></div>
<div id="switcher"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

<script>
const VARIANTS = __VARIANTS__;
const [W, H] = __SIZE__;
const canvas = document.getElementById('canvas');
const host = document.getElementById('svgHost');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

const stage = document.getElementById('stage');
const pz = Panzoom(canvas, { maxScale: 60, minScale: 0.2, canvas: true });
stage.addEventListener('wheel', pz.zoomWithWheel);
function fit() {
  const s = Math.min(stage.clientWidth / W, stage.clientHeight / H) * 0.95;
  pz.zoom(s, { animate: false });
  setTimeout(() => pz.pan((stage.clientWidth / s - W) / 2, (stage.clientHeight / s - H) / 2, { animate: false }));
}
document.getElementById('reset').onclick = fit;

let mode = 'outline', hl = null;
const params = new URLSearchParams(location.search);
let idx = Math.max(0, VARIANTS.findIndex(v => v.key === (params.get('variant') || 'A')));

function applyMode() {
  host.className = 'm-' + mode + (document.getElementById('nums').checked ? ' nums' : '') + (hl !== null ? ' hl' : '');
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  const op = +document.getElementById('op').value / 100;
  document.getElementById('orig').style.opacity = mode === 'orig' ? 1 : op;
  document.getElementById('imp').style.display = mode === 'imp' ? 'block' : 'none';
  const svg = host.querySelector('svg');
  if (svg) svg.style.opacity = (mode === 'orig' || mode === 'imp') ? 0 : (op > 0 ? 1 - op * 0.6 : 1);
}
function highlight(k) { hl = hl === k ? null : k; paintHL(); }
function paintHL() {
  host.querySelectorAll('[data-c]').forEach(el => el.classList.toggle('on', hl !== null && +el.dataset.c === hl));
  document.querySelectorAll('#pal li').forEach((li, i) => li.classList.toggle('on', i === hl));
  // in outline mode a highlighted region shows its colour; others stay white
  host.querySelectorAll('.r').forEach(el => {
    el.style.fill = (mode === 'outline' && hl !== null && +el.dataset.c === hl) ? el.getAttribute('fill') : '';
  });
  applyMode();
}
function show(i) {
  idx = (i + VARIANTS.length) % VARIANTS.length;
  const v = VARIANTS[idx];
  hl = null;
  host.innerHTML = v.svg;
  document.getElementById('vname').textContent = v.key + ' · ' + v.name;
  document.getElementById('vlabel').textContent = v.key + ' (' + v.name + ')';
  document.getElementById('stats').innerHTML =
    Object.entries(v.stats).map(([k, x]) => `<tr><td>${k}</td><td>${x}</td></tr>`).join('');
  document.getElementById('pal').innerHTML = v.palette.map(p =>
    `<li><b>${p.n}</b><span class="sw" style="background:${p.hex}"></span><span>${p.recipe}</span><span class="share">${p.share}%</span></li>`).join('');
  document.querySelectorAll('#pal li').forEach((li, k) => li.onclick = () => highlight(k));
  document.getElementById('tubes').textContent = v.tubes.join(', ');
  const u = new URL(location); u.searchParams.set('variant', v.key); history.replaceState(null, '', u);
  applyMode();
}

document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.m; paintHL(); });
document.getElementById('nums').onchange = applyMode;
document.getElementById('op').oninput = applyMode;
document.getElementById('prev').onclick = () => show(idx - 1);
document.getElementById('next').onclick = () => show(idx + 1);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key === 'ArrowRight') show(idx + 1);
});

const tip = document.getElementById('tip');
host.addEventListener('mousemove', e => {
  const el = e.target.closest('.r');
  if (!el) { tip.style.display = 'none'; return; }
  const p = VARIANTS[idx].palette[+el.dataset.c];
  tip.textContent = `№${p.n} · ${p.recipe}`;
  tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px';
});
host.addEventListener('mouseleave', () => tip.style.display = 'none');

show(idx);
fit();
// top bar: every generated page listed in images.json (written by variants.py)
fetch('images.json').then(r => r.json()).then(list => {
  const bar = document.getElementById('imgbar');
  const here = location.pathname.split('/').pop();
  list.forEach(f => {
    const a = document.createElement('a');
    a.textContent = f.replace('.html', '');
    a.className = (f === here ? 'on' : '') + (/-v[234]\.html$/.test(f) ? '' : ' v1');
    a.onclick = e => { e.preventDefault(); location.href = f + '?variant=' + VARIANTS[idx].key; };
    a.href = f;
    bar.appendChild(a);
  });
}).catch(() => {});
</script>
</body>
